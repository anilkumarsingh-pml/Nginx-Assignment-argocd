<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGINX Application — Version 1</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(160deg, #0f2744 0%, #1a4a6e 50%, #0d3b2e 100%);
      color: #f5f7fa;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0;
      opacity: 0.85;
      font-size: 1.1rem;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>NGINX Application — Version 1</h1>
    <p>Served by NGINX on Kubernetes</p>
    <div class="badge">v1</div>
  </main>
</body>
</html>
