# Single-tenant prod platform bootstrap (parity with nonprod).

repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
targetRevision: HEAD
environment: prod

appProject:
  name: platform-prod
  description: Single-tenant prod platform (Kind)
  extraDestinations:
    - namespace: argocd
      server: https://kubernetes.default.svc

applications:
  - name: storefront
    namespace: storefront
    chartPath: charts/webapp
    valueFiles:
      - values-storefront.yaml
      - values-prod.yaml
  - name: checkout-api
    namespace: checkout-api
    chartPath: charts/webapp
    valueFiles:
      - values-checkout-api.yaml
      - values-prod.yaml
  - name: admin-console
    namespace: admin-console
    chartPath: charts/webapp
    valueFiles:
      - values-admin-console.yaml
      - values-prod.yaml
