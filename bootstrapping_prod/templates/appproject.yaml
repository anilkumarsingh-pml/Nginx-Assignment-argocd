apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.appProject.name }}
  namespace: argocd
  labels:
    app.kubernetes.io/name: {{ include "bootstrapping-prod.name" . }}
    app.kubernetes.io/part-of: platform-gitops
    environment: {{ .Values.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: {{ .Values.appProject.description | quote }}
  sourceRepos:
    - {{ .Values.repoURL | quote }}
  destinations:
    {{- range .Values.applications }}
    - namespace: {{ .namespace }}
      server: https://kubernetes.default.svc
    {{- end }}
    {{- with .Values.appProject.extraDestinations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
