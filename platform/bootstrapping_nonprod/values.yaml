# Root bootstrap for nonprod — lists layers (PML-style deployments), not individual apps.
repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
targetRevision: HEAD
environment: nonprod

# Each entry becomes an Argo CD Application (Helm template).
deployments:
  - name: platform-appprojects
    path: platform/nonprod/project-platform/infra-manifests/app-projects
    # directory sync (raw YAML AppProject)
    helm: false
    wave: "0"
    destinationNamespace: argocd
    project: default
  - name: platform-apps
    path: platform/nonprod/project-platform/app-of-apps
    helm: true
    wave: "1"
    destinationNamespace: argocd
    project: default
