# Apply once on non-prod-cluster after Argo CD is installed:
#   kubectl --context kind-non-prod-cluster apply -f platform/argocd-deployable/overlays/nonprod/root_app/bootstrapping-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-nonprod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
    targetRevision: HEAD
    path: platform/bootstrapping_nonprod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
