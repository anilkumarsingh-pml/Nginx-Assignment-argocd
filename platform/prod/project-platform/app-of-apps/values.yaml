repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
targetRevision: HEAD
environment: prod
appProject: platform-prod
chartPath: platform/prod/project-platform/app-helm-chart/webapp

applications:
  - name: storefront
    namespace: storefront
    valueFiles:
      - values-storefront.yaml
      - values-prod.yaml
  - name: checkout-api
    namespace: checkout-api
    valueFiles:
      - values-checkout-api.yaml
      - values-prod.yaml
  - name: admin-console
    namespace: admin-console
    valueFiles:
      - values-admin-console.yaml
      - values-prod.yaml
