# Default chart values (shared baseline).
# Environment overrides live in values-nonprod.yaml (and later values-prod.yaml).

nameOverride: ""
fullnameOverride: nginx-app

replicaCount: 2

image:
  repository: nginx-app
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# Labels used by Deployment selector and Service
appLabel: nginx-app
