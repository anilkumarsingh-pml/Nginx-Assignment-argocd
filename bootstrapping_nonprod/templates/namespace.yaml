{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ include "bootstrapping-nonprod.name" $ }}
    app.kubernetes.io/part-of: nginx-gitops
    environment: nonprod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
