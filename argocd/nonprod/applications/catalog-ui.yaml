apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: learning-nonprod
  source:
    repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
    targetRevision: HEAD
    path: charts/nginx-app
    helm:
      valueFiles:
        - values-catalog-ui.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: catalog-ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
