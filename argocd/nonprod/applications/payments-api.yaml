apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: learning-nonprod
  source:
    repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
    targetRevision: HEAD
    path: charts/nginx-app
    helm:
      valueFiles:
        - values-payments-api.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: payments-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
