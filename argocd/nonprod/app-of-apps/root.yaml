# Apply on non-prod-cluster after Argo CD is installed:
#   kubectl --context kind-non-prod-cluster apply -f argocd/nonprod/app-of-apps/root.yaml
#
# Root points at the bootstrap Helm chart. That chart generates AppProject,
# namespaces, and Application CRs for every app listed in values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-nonprod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
    targetRevision: HEAD
    path: bootstrapping_nonprod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
