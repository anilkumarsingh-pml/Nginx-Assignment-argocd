# Apply on prod-cluster after Argo CD is installed:
#   kubectl --context kind-prod-cluster apply -f argocd/prod/app-of-apps/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
    targetRevision: HEAD
    path: bootstrapping_prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
