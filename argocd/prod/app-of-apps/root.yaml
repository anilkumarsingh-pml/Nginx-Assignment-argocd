# PROD root App-of-Apps — learning stub for env parity.
# Do NOT apply this on the Kind learning cluster unless you intentionally want prod resources.
# Kind lab bootstrap: kubectl apply -f argocd/nonprod/app-of-apps/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gitops-root-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
    targetRevision: HEAD
    path: argocd/prod
    directory:
      recurse: true
      exclude: '{app-of-apps/*,README.md}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
