# Deploys bootstrapping_prod Helm chart (AppProject + Namespace) for prod parity.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrapping-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anilkumarsingh-pml/Nginx-Assignment-argocd.git
    targetRevision: HEAD
    path: bootstrapping_prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
